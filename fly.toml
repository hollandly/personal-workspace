# Fly.io 部署配置（fly launch / fly deploy）
app = "personal-workspace"
primary_region = "nrt"      # 东京，国内访问较快

[build]

[env]
  PORT = "3000"
  WS_DATA_DIR = "/data"
  # WS_INVITE_CODE = "你的邀请码"   # 建议设置，防止陌生人注册

[mounts]
  source = "workspace_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
